# 11 demodulated 38kHz channels via a single USB Arduino Nano.
# Pinout for a classic Nano; simultaneous decode must be bench-verified.
controller: nano-1
transport: usb_serial
baud: 115200
target_visibility_ms: 500
receivers:
  - {id: 1, pin: D2, name: Tunnel Entrance}
  - {id: 2, pin: D3, name: Yard Entrance}
  - {id: 3, pin: D4, name: Ski Entrance}
  - {id: 4, pin: D5, name: Tunnel Exit East}
  - {id: 5, pin: D6, name: Tunnel Exit West}
  - {id: 6, pin: D7, name: Underground Entrance}
  - {id: 7, pin: D8, name: Tipper Entrance}
  - {id: 8, pin: D9, name: Stall 1A}
  - {id: 9, pin: D10, name: Stall 1B}
  - {id: 10, pin: D11, name: Stall 2}
  - {id: 11, pin: D12, name: Stall 3}
