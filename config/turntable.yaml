# Operating rules for the dedicated XIAO ESP32-C6 turntable controller.
# The consist count is supplied per entry authorization; no fixed vehicle count
# is safe because locomotives and consists vary.
mode: simulation
approach_section: UND-4
access_turnout: H
turnout_default: straight
rotation_degrees: 180
motion: [rotate_180_forward, rotate_180_reverse_to_home]
additional_approach_hall_sensors: 0
position_feedback: not_configured
require_verified_stop_before_dispatch: true
hardware_outputs_enabled: false
pins:
  home_switch: D0
  rotated_switch: D1
  motor_in1: D2
  motor_in2: D3
  polarity_relay: D4
  track_power_relay: D5
  reed_end_a: D6
  reed_end_b: D7
switch_polarity: active_low
vehicle_magnets: configured_consist_count
reed_debounce_ms: 15
post_train_cooldown_ms: 500
require_stationary_clearance: true
