mode: simulation
i2c:
  bus: 1
  level_shifter_required: true
  boards: {motor_1: 0x40, motor_2: 0x41, servo: 0x42, sensors_1: 0x20, sensors_2: 0x21}
gpio_safe_start: true
# Physical E-Stop: COM=3.3V, NC=input with pull-down; LOW means pressed.
# Leave null in simulation and until the actual Raspberry Pi GPIO is validated.
estop:
  gpio: null
  serial_controllers: []
  serial_baudrate: 115200
# Explicit commissioning list.  Keep empty in the safe simulation template;
# normal hardware mode refuses to initialize until the operator supplies IDs.
locomotive_controllers: []
