mode: simulation
i2c:
  bus: 1
  level_shifter_required: true
  boards: {motor_1: 0x40, motor_2: 0x41, servo: 0x42, sensors_1: 0x20, sensors_2: 0x21}
gpio_safe_start: true
# No Raspberry Pi GPIO E-Stop is installed in this railroad configuration.
# The serial controller registry remains the transport for controller-local
# stop/watchdog handling and dispatcher stop propagation.
estop:
  serial_controllers:
    - {id: turntable, type: xiao_esp32_c6_turntable, port: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_90:64:9B:AA:64:5C-if00}
    - {id: tipper, type: xiao_esp32_c6_tipper, port: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_90:64:9B:AA:64:AC-if00}
  serial_baudrate: 115200
# Final controller assignments. Ports/addresses remain commissioning
# placeholders. Each locomotive is an independent operating unit: a missing
# or faulted M5 blocks only that locomotive, not the other three.
locomotive_controllers:
  - {id: 1, type: m5_atom_echo, transport: udp, address: 10.77.0.101}
  - {id: 2, type: m5_atom_echo, transport: udp, address: 10.77.0.102}
  - {id: 3, type: m5_atom_echo, transport: udp, address: 10.77.0.103}
  - {id: 4, type: m5_atom_echo, transport: udp, address: 10.77.0.104}
# The dedicated XIAO ESP32-C6 USB controllers above are accessory controllers,
# not locomotive controllers; exact device paths are deployment placeholders.
# Declarative inventory used for validation and SETTINGS display. This list is
# safe to load on macOS; it does not open a bus or write an output.
reserved_bcm_pins: [2, 3, 14, 15]
io_registry:
  - {board: mcp23017_0x20, address: 0x20, channel: GPA0, device_type: mcp23017, function: turnout_A_1, location: turnout A, direction: input, polarity: active_low}
  - {board: mcp23017_0x20, address: 0x20, channel: GPA1, device_type: mcp23017, function: turnout_A_2, location: turnout A, direction: input, polarity: active_low}
  - {board: mcp23017_0x20, address: 0x20, channel: GPA2, device_type: mcp23017, function: turnout_A_3, location: turnout A, direction: input, polarity: active_low}
  - {board: mcp23017_0x20, address: 0x20, channel: GPA3, device_type: mcp23017, function: turnout_B_1, location: turnout B, direction: input, polarity: active_low}
