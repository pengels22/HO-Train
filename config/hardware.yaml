mode: simulation
# Firmata is the commissioned USB architecture. Keep disabled until the
# persistent USB paths and electrical harness are verified on the Pi.
firmata:
  enabled: true
  layout: config/firmata_layout.yaml
# Firmata USB is the active controller architecture. Pi GPIO is not used for
# railroad I/O. The dedicated XIAO controllers retain local USB links.
# USB accessory controller registration and local STOP/watchdog propagation.
controller_transport:
  serial_controllers:
    - {id: turntable, type: xiao_esp32_c6_turntable, port: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_90:64:9B:AA:64:5C-if00}
    - {id: tipper, type: xiao_esp32_c6_tipper, port: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_90:64:9B:AA:64:AC-if00}
  serial_baudrate: 115200
yard_outputs:
  # Three physical sections are reserved. GPIO mappings remain unassigned
  # until the MCP/PCA hardware is installed and verified; defaults are off.
  - {track: 1, sections: [1A, 1B], gpio: null, requested: false, verified: false}
  - {track: 2, sections: [2], gpio: null, requested: false, verified: false}
  - {track: 3, sections: [3], gpio: null, requested: false, verified: false}
bench_ir_receiver:
  enabled: true
  port: /dev/serial/by-id/usb-Arduino_Nano_ESP32_4827E2FC9A24-if01
  baudrate: 115200
# Final controller assignments. Ports/addresses remain commissioning
# placeholders. Each locomotive is an independent operating unit: a missing
# or faulted M5 blocks only that locomotive, not the other three.
locomotive_controllers:
  # Temporary Train 1 commissioning override: active UDP-compatible C6 at
  # .46 has proven command reception. Lab 1 reports accepted commands as
  # explicitly unverified command feedback until real UDP telemetry is proven.
  # The C6 firmware watchdog remains the final loss-of-communications stop.
  - {id: 1, type: m5_atom_echo, transport: udp, address: 192.168.20.46, control_only: true}
  - {id: 2, type: m5_atom_echo, transport: udp, address: 192.168.20.102}
  - {id: 3, type: m5_atom_echo, transport: udp, address: 192.168.20.103}
  - {id: 4, type: m5_atom_echo, transport: udp, address: 192.168.20.104}
# The dedicated XIAO ESP32-C6 USB controllers above are accessory controllers,
# not locomotive controllers; exact device paths are deployment placeholders.
