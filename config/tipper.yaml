# Dedicated XIAO ESP32-C6 rotary tipper controller. GPIOs are the validated
# XIAO C6 assignments supplied for the dedicated tipper harness.
controller: xiao_esp32_c6_tipper
board: esp32:esp32:XIAO_ESP32C6
transport: usb_serial
# Bench-verified on 2026-11-13. The macOS port is transient; use the
# Raspberry Pi udev path below after matching this USB identity on the Pi.
usb_serial:
  serial_number: "90:64:9B:AA:64:AC"
  chip: ESP32-C6FH4
  mac_address: "90:64:9B:AA:64:AC"
  raspberry_pi_path: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_90:64:9B:AA:64:AC-if00
  raspberry_pi_path_status: verified_on_lab1
port: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_90:64:9B:AA:64:AC-if00
speed_limit_mm_s: 25.4
pins:
  motor_in1: 16
  motor_in2: 17
  lock_in3: 19
  lock_in4: 20
  decoupler_output: 18
  ir_front_clear: null
  ir_back_clear: null
  hall_back: 21
  hall_front: 2
  hall_clear: 22
  encoder: 23
  lock_direction: {unlock: forward, lock: reverse}
  lock_duration_ms: 800
