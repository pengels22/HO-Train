# Yard topology; physical outputs are defined in firmata_layout.yaml.
default_power: off
relay_output_source: config/firmata_layout.yaml#relay_nano.yard_power
tracks:
  "1": {stalls: ["1A", "1B"]}
  "2": {stalls: ["2"]}
  "3": {stalls: ["3"]}
departure: restore_power_then_require_fresh_zero_speed_command_and_route_clear
