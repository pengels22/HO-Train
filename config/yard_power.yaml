# Design only. Normally open DC-rated relays; no output GPIO armed.
default_power: off
relay_outputs:
  1: {bcm: 12, active_low: true, verified: false}
  2: {bcm: 13, active_low: true, verified: false}
  3: {bcm: 16, active_low: true, verified: false}
tracks:
  "1": {stalls: ["1A", "1B"], relay_output: 1}
  "2": {stalls: ["2"], relay_output: 2}
  "3": {stalls: ["3"], relay_output: 3}
departure: restore_power_then_require_fresh_zero_speed_command_and_route_clear
