# Eight relay-driven powered turnouts (A-H). Passive P1-P3 have no relay.
# External pull-ups fitted to active-low 5V relay inputs.
# HIGH/OFF selects NC (standard); LOW/ON selects NO (alternate).
controller: nano_classic_firmata
active_low: true
clearance_open_ms: 1000
require_consist_tail_clear: true
auto_return_to_standard: true
turnouts:
  A: {pin: D2, standard: diverging, nc: diverging, no: straight, exit_reeds: {straight: turnout_A_straight, diverging: turnout_A_divergent}}
  B: {pin: D3, standard: straight, nc: straight, no: diverging, exit_reeds: {straight: turnout_B_straight, diverging: turnout_B_divergent}}
  C: {pin: D4, standard: straight, nc: straight, no: diverging, exit_reeds: {straight: turnout_C_straight, diverging: turnout_C_divergent}}
  D: {pin: D5, standard: straight, nc: straight, no: diverging, exit_reeds: {straight: turnout_D_straight, diverging: turnout_D_divergent}}
  E: {pin: D6, standard: straight, nc: straight, no: diverging, exit_reeds: {straight: turnout_E_straight, diverging: turnout_E_divergent}}
  F: {pin: D7, standard: straight, nc: straight, no: diverging, exit_reeds: {straight: turnout_F_straight, diverging: turnout_F_divergent}}
  G: {pin: D8, standard: straight, nc: straight, no: diverging, exit_reeds: {straight: turnout_G_straight, diverging: turnout_G_divergent}}
  H: {pin: D9, standard: straight, nc: straight, no: diverging, exit_reeds: {straight: turnout_H_straight, diverging: turnout_H_divergent}}
# Relay state persists until another command or safe automatic restoration.
# Reed sensors indicate train position, not actual turnout-point alignment.
