# Seven powered turnouts use one SPDT relay each.
#
# Turnout wiring:
#   turnout common (C) -> external +12 V turnout supply
#   relay common       -> turnout common/return
#   relay NC           -> straight
#   relay NO           -> diverging
#
# Relay control is through PCA9685 0x41 channels below. The Pi must never
# source the turnout +12 V directly.
controller: servo
board: 0x41
active_high: false
turnouts:
  A: {output: 0, straight_contact: NC, diverging_contact: NO}
  B: {output: 1, straight_contact: NC, diverging_contact: NO}
  C: {output: 2, straight_contact: NC, diverging_contact: NO}
  D: {output: 3, straight_contact: NC, diverging_contact: NO}
  E: {output: 4, straight_contact: NC, diverging_contact: NO}
  F: {output: 5, straight_contact: NC, diverging_contact: NO}
  G: {output: 6, straight_contact: NC, diverging_contact: NO}
