polarity: active_low
debounce_ms: 15
count_mode: closed_open_cycle
# Contact debounce is deliberately separate from train pulse/clear timing.
mcp23017:
  # Inputs are assigned sequentially: common, straight, divergent reeds per turnout.
  # A = 0-2, B = 3-5, C = 6-8, D = 9-11, E = 12-14, F = 15-17, G = 18-20.
  "0x20": {GPA0: turnout_A_common, GPA1: turnout_A_straight, GPA2: turnout_A_divergent, GPA3: turnout_B_common, GPA4: turnout_B_straight, GPA5: turnout_B_divergent, GPA6: turnout_C_common, GPA7: turnout_C_straight, GPB0: turnout_C_divergent, GPB1: turnout_D_common, GPB2: turnout_D_straight, GPB3: turnout_D_divergent, GPB4: turnout_E_common, GPB5: turnout_E_straight, GPB6: turnout_E_divergent, GPB7: turnout_F_common}
  "0x21": {GPA0: turnout_F_straight, GPA1: turnout_F_divergent, GPA2: turnout_G_common, GPA3: turnout_G_straight, GPA4: turnout_G_divergent, GPA5: mine_loading, GPA6: farm_loading, GPA7: ski_lodge, GPB0: town, GPB1: farm_station_ir, GPB2: town_station_ir, GPB3: mine_station_ir, GPB4: spare_GPB4, GPB5: spare_GPB5, GPB6: spare_GPB6, GPB7: spare_GPB7}

# H remains in the legacy route/turntable model; it is intentionally absent
# from the confirmed seven-powered-turnout hardware roster.
topology_reconciliation: {relay_turnouts: [A, B, C, D, E, F, G], feedback_sensors: [turnout_A_common, turnout_A_straight, turnout_A_divergent, turnout_B_common, turnout_B_straight, turnout_B_divergent, turnout_C_common, turnout_C_straight, turnout_C_divergent, turnout_D_common, turnout_D_straight, turnout_D_divergent, turnout_E_common, turnout_E_straight, turnout_E_divergent, turnout_F_common, turnout_F_straight, turnout_F_divergent, turnout_G_common, turnout_G_straight, turnout_G_divergent], legacy_turnout: H, status: relay_commanded_with_reed_inputs}
